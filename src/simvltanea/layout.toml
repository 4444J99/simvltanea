# Logical path roles and repository placement policy.
[contract]
version = "0.1.0"

[paths]
generated = "var"
work = "var/work"
samples = "var/samples"
renders = "var/renders"
site = "var/site"
packages = "var/packages"
proofs = "var/proofs"
artifact_output = "var/artifact-001"
examples = "examples"
fixtures = "fixtures"
artifact_fixture = "fixtures/artifact-001"
registry = "editions/registry.json"
github = ".github"
config = "config"
editions = "editions"
docs = "docs"
archive = "archive"
evidence = "evidence"
source = "src"
package = "src/simvltanea"
tools = "tools"
tests = "tests"

[policy]
generated_lanes = ["{generated}"]
allowed_lane_placeholders = ["{generated}/.gitkeep"]
artifact_baseline_files = ["{artifact_fixture}/baseline-manifest.json", "{artifact_fixture}/baseline/render_triptych.original.py"]
raw_intake_files = ["{archive}/raw/.gitkeep", "{archive}/raw/PR9_review_proof_2026-09-06/README.md", "{archive}/raw/README.md"]
local_only_roots = [".pytest_cache", ".venv", "{generated}"]
proof_output_directories = ["{evidence}/visual-proof/media", "{evidence}/visual-proof/renders"]
approved_root_directories = [".vscode", "{archive}", "{config}", "{docs}", "{editions}", "{evidence}", "{examples}", "{fixtures}", "{generated}", "{github}", "{source}", "{tests}", "{tools}"]
approved_root_files = [".gitignore", "LICENSE", "README.md", "pyproject.toml"]
config_files = ["{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore"]
governance_files = ["{github}/CODEOWNERS", "{github}/CONTRIBUTING.md", "{github}/SECURITY.md"]
required_files = [".gitignore", "LICENSE", "README.md", "pyproject.toml", "{archive}/PROJECT_MANIFEST.md", "{archive}/chatgpt/README.md", "{archive}/incubation/README.md", "{archive}/raw/README.md", "{artifact_fixture}/baseline-manifest.json", "{artifact_fixture}/baseline/render_triptych.original.py", "{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore", "{docs}/README.md", "{docs}/architecture/CANON.md", "{docs}/authoring/EDITION_AUTHORING.md", "{docs}/governance/BRANCHES.md", "{docs}/governance/LAYOUT.md", "{docs}/governance/NAMING.md", "{docs}/governance/STATUS.md", "{docs}/governance/STRUCTURE.md", "{docs}/plans/INDEX.md", "{docs}/provenance/PROVENANCE.md", "{evidence}/visual-proof/README.md", "{evidence}/visual-proof/ledger.json", "{examples}/README.md", "{generated}/.gitkeep", "{github}/CODEOWNERS", "{github}/CONTRIBUTING.md", "{github}/SECURITY.md", "{github}/workflows/ci.yml", "{package}/README.md", "{package}/__init__.py", "{package}/authoring/__init__.py", "{package}/browser/__init__.py", "{package}/generators/__init__.py", "{package}/rendering/__init__.py", "{registry}", "{tests}/README.md", "{tools}/README.md", "{tools}/editions/__init__.py", "{tools}/media/__init__.py", "{tools}/preservation/__init__.py", "{tools}/publishing/__init__.py", "{tools}/verification/__init__.py", "{tools}/verification/sync_layout.py", "{package}/layout.toml"]
required_directories = ["{archive}", "{archive}/chatgpt", "{archive}/incubation", "{archive}/raw", "{artifact_fixture}/baseline", "{config}", "{config}/lint", "{docs}", "{docs}/architecture", "{docs}/authoring", "{docs}/governance", "{docs}/plans", "{docs}/provenance", "{editions}", "{evidence}", "{evidence}/visual-proof", "{evidence}/visual-proof/frames", "{examples}", "{fixtures}", "{generated}", "{github}", "{package}", "{package}/authoring", "{package}/browser", "{package}/generators", "{package}/rendering", "{source}", "{tests}", "{tools}", "{tools}/editions", "{tools}/media", "{tools}/preservation", "{tools}/publishing", "{tools}/verification"]
source_file_exceptions = ["{package}/layout.toml", "{package}/layouts.json"]
test_python_exceptions = ["__init__.py", "conftest.py"]
documentation_file_exceptions = ["{docs}/continuations/pr-20/session-closeout.json"]
doc_subdirectories = ["continuations", "architecture", "authoring", "governance", "plans", "provenance"]
archive_categories = ["bundles", "evidence", "extracts", "handoffs", "logs", "media", "prompts", "receipts", "research", "sessions", "threads"]
proof_files = ["{evidence}/visual-proof/README.md", "{evidence}/visual-proof/ledger.json"]

[policy.source_extensions]
"{source}" = [".js", ".md", ".py", ".typed"]
"{tools}" = [".md", ".py"]
"{examples}" = [".json", ".md"]

[policy.github_folder_extensions]
"workflows" = [".yaml", ".yml"]
"ISSUE_TEMPLATE" = [".md", ".yaml", ".yml"]
"instructions" = [".md"]

[lint]
ignore = [".git", "{github}", ".gitignore", "{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore", ".pytest_cache", ".venv", ".vscode", "**/*.egg-info", "build", "dist", "**/__pycache__", "{archive}", "{artifact_fixture}/baseline", "{generated}"]
markdown_ignore = ["/.git/", "/{archive}/", "/{github}/instructions/mermaid.instructions.md", "/{generated}/", "/.pytest_cache/", "/.venv/", "**/__pycache__/"]

# Additive draft binding. Existing [contract], [paths], [policy], and [lint]
# remain effective and unchanged. This profile cannot activate itself.
[repository_profile]
schema = "simvltanea.repository-profile/v1"
version = "1.0.0-draft.1"
vocabulary_version = "1.0.0"
state = "draft"
scope = "registered-maintenance-objects"
owner_authority = "ownership"

[repository_profile.authorities.ownership]
fact = "repository-review-owner"
locator = "{github}/CODEOWNERS"
owner_authority = "ownership"
write_path = "Owner-reviewed PR changing CODEOWNERS; never this projection"
refresh = "Review and update this pin when the canonical ownership declaration changes"
drift_check = "verify_repository_profile --check compares Git blob identity"
conflict = "resolved"
git_blob = "1c7b4bf87f50be81299b540dfb8a48f550333983"

[repository_profile.authorities.naming]
fact = "effective-filesystem-spelling-policy"
locator = "{config}/lint/ls-lint.yml"
owner_authority = "ownership"
write_path = "Owner-reviewed PR to the existing ls-lint policy; no competing naming linter"
refresh = "Review consumer compatibility before refreshing this pin"
drift_check = "Git blob pin plus existing ls-lint execution in CI"
conflict = "resolved"
git_blob = "faf6e3b6f0d17c507f696cfdc39a73b3109d9793"

[repository_profile.authorities.provenance]
fact = "historical-archive-catalog"
locator = "{archive}/PROJECT_MANIFEST.md"
owner_authority = "ownership"
write_path = "Append or annotate the canonical catalog; do not rewrite originals"
refresh = "Review provenance additions and refresh this pin in the same PR"
drift_check = "Git blob pin; not an independent backup or rights verification"
conflict = "resolved"
git_blob = "3ab9ca33ba3a96874be173ab2d59f35032fa18d9"

[repository_profile.concepts.repository-profile]
term = "repository-profile"
definition = "Repository-specific metadata, derivation, authority, and compatibility rules, not audiovisual composition geometry"

[repository_profile.classes.verification-command]
role = "tools"
area = "verification"
prefix = "verify"
case = "snake"
extension = ".py"
definition = "Read-only operational validation command; tools/verification owns verification rather than runtime authoring"

[repository_profile.classes.governance-test]
role = "tools"
area = "verification"
prefix = "test"
case = "snake"
extension = ".py"
definition = "Co-located executable governance contract tests discovered by pytest and the historical unittest bridge"

[repository_profile.classes.governance-guide]
role = "docs"
area = "governance"
prefix = ""
case = "upper-snake"
extension = ".md"
definition = "Actively maintained canonical governance explanation; not an immutable historical receipt"

[repository_profile.role_metadata.generated]
material = "generated"
lifecycle = "local-only"
purpose = "Boundary for generated outputs and private intake; only the existing placeholder may be tracked"

[repository_profile.role_metadata.work]
material = "generated"
lifecycle = "local-only"
purpose = "Transient operational work; not a worktree custody container"

[repository_profile.role_metadata.samples]
material = "generated"
lifecycle = "local-only"
purpose = "Local source-media intake and generated samples; privacy and rights not inferred"

[repository_profile.role_metadata.renders]
material = "generated"
lifecycle = "local-only"
purpose = "Regenerable rendered audiovisual output"

[repository_profile.role_metadata.site]
material = "generated"
lifecycle = "local-only"
purpose = "Generated publication preview; not authority to deploy"

[repository_profile.role_metadata.packages]
material = "generated"
lifecycle = "local-only"
purpose = "Generated delivery packages; not release approval"

[repository_profile.role_metadata.proofs]
material = "generated"
lifecycle = "local-only"
purpose = "Fresh generated verification outputs; not historical originals"

[repository_profile.role_metadata.artifact_output]
material = "generated"
lifecycle = "local-only"
purpose = "Synthetic Artifact 001 family generated by the existing authoring command"

[repository_profile.role_metadata.examples]
material = "template"
lifecycle = "active"
purpose = "Safe authoring configuration examples; not production edition facts"

[repository_profile.role_metadata.fixtures]
material = "fixture"
lifecycle = "retained"
purpose = "Versioned regression inputs distinct from generated proof outputs"

[repository_profile.role_metadata.artifact_fixture]
material = "fixture"
lifecycle = "retained"
purpose = "Historical renderer baseline and its manifest; preserve exact identities"

[repository_profile.role_metadata.registry]
material = "registry"
lifecycle = "active"
purpose = "The production edition registry; this profile does not duplicate its edition records"

[repository_profile.role_metadata.github]
material = "tool-owned"
lifecycle = "active"
purpose = "GitHub-recognized automation, templates, review ownership, and security policy"

[repository_profile.role_metadata.config]
material = "tool-owned"
lifecycle = "active"
purpose = "Existing native lint policies and their generated exclusions"

[repository_profile.role_metadata.editions]
material = "registry"
lifecycle = "active"
purpose = "Edition registry and guide; preserve the existing edition schema and validator"

[repository_profile.role_metadata.docs]
material = "authored"
lifecycle = "active"
purpose = "Current architecture, authoring, governance, plans, and provenance explanations"

[repository_profile.role_metadata.archive]
material = "historical"
lifecycle = "retained"
purpose = "Preserved incubation and recovered ChatGPT records; custody remains separate"

[repository_profile.role_metadata.evidence]
material = "reviewed-evidence"
lifecycle = "retained"
purpose = "Curated proof ledgers and inspected frames; not artist acceptance"

[repository_profile.role_metadata.source]
material = "authored"
lifecycle = "active"
purpose = "Packaged runtime implementation and native package metadata"

[repository_profile.role_metadata.package]
material = "authored"
lifecycle = "active"
purpose = "SIMVLTANEA Python namespace and its bundled layout contract"

[repository_profile.role_metadata.tools]
material = "authored"
lifecycle = "active"
purpose = "Operational commands grouped by workflow responsibility"

[repository_profile.role_metadata.tests]
material = "authored"
lifecycle = "active"
purpose = "Executable model, media, browser, edition, and governance regressions"

[[repository_profile.objects]]
id = "simvltanea.governance.profile-verifier"
class = "verification-command"
concept = "repository-profile"
lifecycle = "active"
access = "public"
keywords = []
relationships = {  }

[[repository_profile.objects]]
id = "simvltanea.governance.profile-tests"
class = "governance-test"
concept = "repository-profile"
lifecycle = "active"
access = "public"
keywords = []
relationships = { tests = ["simvltanea.governance.profile-verifier"] }

[[repository_profile.objects]]
id = "simvltanea.governance.profile-guide"
class = "governance-guide"
concept = "repository-profile"
lifecycle = "active"
access = "public"
keywords = []
relationships = { documents = ["simvltanea.governance.profile-verifier", "simvltanea.governance.profile-tests"] }

[[repository_profile.exceptions]]
scope = "{archive}"
reason = "Authentic historical names and original records must not be normalized"
owner_authority = "ownership"
authority = "provenance"
review_when = "Review when importing or annotating a historical record; never automatic expiry deletion"
compatibility = "Published citations and provenance remain addressed by their existing paths"

[[repository_profile.exceptions]]
scope = "{artifact_fixture}/baseline"
reason = "Original renderer bytes are independent regression authority"
owner_authority = "ownership"
authority = "provenance"
review_when = "Owner review before any baseline replacement, retaining the original and comparison evidence"
compatibility = "Historical decoded audio/video comparison must remain available"

[[repository_profile.exceptions]]
scope = "{generated}"
reason = "Generated and private outputs remain governed by existing lifecycle checks, not spelling rules"
owner_authority = "ownership"
authority = "ownership"
review_when = "Review when generated roles or privacy/retention requirements change"
compatibility = "Local outputs and private intake are not automatically renamed, copied, indexed, or published"
