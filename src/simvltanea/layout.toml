# Logical path roles and repository placement policy.
[contract]
version = "0.1.0"

[paths]
generated = "var"
work = "var/work"
samples = "var/samples"
renders = "var/renders"
site = "var/site"
packages = "var/packages"
proofs = "var/proofs"
artifact_output = "var/artifact-001"
examples = "examples"
fixtures = "fixtures"
artifact_fixture = "fixtures/artifact-001"
registry = "editions/registry.json"
github = ".github"
config = "config"
editions = "editions"
docs = "docs"
archive = "archive"
evidence = "evidence"
source = "src"
package = "src/simvltanea"
tools = "tools"
tests = "tests"

[policy]
generated_lanes = ["{generated}"]
allowed_lane_placeholders = ["{generated}/.gitkeep"]
artifact_baseline_files = ["{artifact_fixture}/baseline-manifest.json", "{artifact_fixture}/baseline/render_triptych.original.py"]
raw_intake_files = ["{archive}/raw/.gitkeep", "{archive}/raw/PR9_review_proof_2026-09-06/README.md", "{archive}/raw/README.md"]
local_only_roots = [".pytest_cache", ".venv", "{generated}"]
proof_output_directories = ["{evidence}/visual-proof/media", "{evidence}/visual-proof/renders"]
approved_root_directories = [".vscode", "{archive}", "{config}", "{docs}", "{editions}", "{evidence}", "{examples}", "{fixtures}", "{generated}", "{github}", "{source}", "{tests}", "{tools}"]
approved_root_files = [".gitignore", "LICENSE", "README.md", "pyproject.toml"]
config_files = ["{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore"]
governance_files = ["{github}/CODEOWNERS", "{github}/CONTRIBUTING.md", "{github}/SECURITY.md"]
required_files = [".gitignore", "LICENSE", "README.md", "pyproject.toml", "{archive}/PROJECT_MANIFEST.md", "{archive}/chatgpt/README.md", "{archive}/incubation/README.md", "{archive}/raw/README.md", "{artifact_fixture}/baseline-manifest.json", "{artifact_fixture}/baseline/render_triptych.original.py", "{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore", "{docs}/README.md", "{docs}/architecture/CANON.md", "{docs}/authoring/EDITION_AUTHORING.md", "{docs}/governance/BRANCHES.md", "{docs}/governance/LAYOUT.md", "{docs}/governance/NAMING.md", "{docs}/governance/STATUS.md", "{docs}/governance/STRUCTURE.md", "{docs}/plans/INDEX.md", "{docs}/provenance/PROVENANCE.md", "{evidence}/visual-proof/README.md", "{evidence}/visual-proof/ledger.json", "{examples}/README.md", "{generated}/.gitkeep", "{github}/CODEOWNERS", "{github}/CONTRIBUTING.md", "{github}/SECURITY.md", "{github}/workflows/ci.yml", "{package}/README.md", "{package}/__init__.py", "{package}/authoring/__init__.py", "{package}/browser/__init__.py", "{package}/generators/__init__.py", "{package}/rendering/__init__.py", "{registry}", "{tests}/README.md", "{tools}/README.md", "{tools}/editions/__init__.py", "{tools}/media/__init__.py", "{tools}/preservation/__init__.py", "{tools}/publishing/__init__.py", "{tools}/verification/__init__.py", "{tools}/verification/sync_layout.py", "{package}/layout.toml"]
required_directories = ["{archive}", "{archive}/chatgpt", "{archive}/incubation", "{archive}/raw", "{artifact_fixture}/baseline", "{config}", "{config}/lint", "{docs}", "{docs}/architecture", "{docs}/authoring", "{docs}/governance", "{docs}/plans", "{docs}/provenance", "{editions}", "{evidence}", "{evidence}/visual-proof", "{evidence}/visual-proof/frames", "{examples}", "{fixtures}", "{generated}", "{github}", "{package}", "{package}/authoring", "{package}/browser", "{package}/generators", "{package}/rendering", "{source}", "{tests}", "{tools}", "{tools}/editions", "{tools}/media", "{tools}/preservation", "{tools}/publishing", "{tools}/verification"]
source_file_exceptions = ["{package}/layout.toml", "{package}/layouts.json"]
test_python_exceptions = ["__init__.py", "conftest.py"]
doc_subdirectories = ["architecture", "authoring", "governance", "plans", "provenance"]
archive_categories = ["bundles", "evidence", "extracts", "handoffs", "logs", "media", "prompts", "receipts", "research", "sessions", "threads"]
proof_files = ["{evidence}/visual-proof/README.md", "{evidence}/visual-proof/ledger.json"]

[policy.source_extensions]
"{source}" = [".js", ".md", ".py", ".typed"]
"{tools}" = [".md", ".py"]
"{examples}" = [".json", ".md"]

[policy.github_folder_extensions]
"workflows" = [".yaml", ".yml"]
"ISSUE_TEMPLATE" = [".md", ".yaml", ".yml"]
"instructions" = [".md"]

[lint]
ignore = [".git", "{github}", ".gitignore", "{config}/lint/ls-lint.yml", "{config}/lint/markdownlint.json", "{config}/lint/markdownlintignore", ".pytest_cache", ".venv", ".vscode", "**/*.egg-info", "build", "dist", "**/__pycache__", "{archive}", "{artifact_fixture}/baseline", "{generated}"]
markdown_ignore = ["/.git/", "/{archive}/", "/{github}/instructions/mermaid.instructions.md", "/{generated}/", "/.pytest_cache/", "/.venv/", "**/__pycache__/"]
