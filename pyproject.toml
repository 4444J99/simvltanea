[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simvltanea"
version = "0.1.0"
description = "Configurable simultaneous video-loop compositions"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simvltanea = ["*.js", "py.typed"]
