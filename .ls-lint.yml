# Active repository naming policy. Historical evidence is intentionally excluded;
# see docs/NAMING.md for the governance rationale and contributor guidance.
ls:
  .dir: kebab-case
  .*: regex:[a-z0-9]+([_-][a-z0-9]+)*
  .*.*: regex:[a-z0-9]+([_-][a-z0-9]+)*
  .py: snake_case
  .js: snake_case
  .md: SCREAMING_SNAKE_CASE | kebab-case

  docs/plans:
    .md: regex:[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)* | regex:INDEX

ignore:
  - .git
  - .github
  - .gitignore
  - .ls-lint.yml
  - .markdownlint.json
  - .markdownlintignore
  - .pytest_cache
  - .venv
  - .vscode
  - "**/__pycache__"
  - archive
  - docs/historical
  - artifact-001/baseline
  - packages
  - renders
  - runtime-proof
  - samples
  - site
  - work
