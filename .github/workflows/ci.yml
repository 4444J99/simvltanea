name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow playwright
          playwright install --with-deps chromium

      - name: Run Core Composition Model & Authoring Tests
        run: |
          python3 test_composition_model.py
          python3 test_authoring_contract.py

      - name: Run FFmpeg Composition Render & Proof Tests
        run: |
          python3 test_composition_render.py
          python3 test_review_proof.py

      - name: Run Browser Boundary & Native Continuity Tests
        run: |
          python3 test_browser_boundaries.py
          python3 test_browser_runtime.py
          python3 test_browser_continuity.py

      - name: Verify Local Lifecycle Cleanliness
        run: |
          python3 verify_local_lifecycle.py
