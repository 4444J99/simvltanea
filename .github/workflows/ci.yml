name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Ensure system Chrome with H.264 codecs is present for native video decode (playwright's chromium lacks proprietary codecs)
          if ! which google-chrome-stable >/dev/null 2>&1 && ! which google-chrome >/dev/null 2>&1; then
            echo "installing google-chrome-stable for H.264 decode"
            sudo apt-get install -y google-chrome-stable || echo "chrome install failed — will fallback to playwright chromium"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          echo "== browser diagnostics =="
          which google-chrome 2>&1; which google-chrome-stable 2>&1; which chromium 2>&1; which chromium-browser 2>&1
          ls -l /usr/bin/*chrome* 2>&1 || echo "no /usr/bin/*chrome*"
          google-chrome --version 2>&1 || google-chrome-stable --version 2>&1 || chromium --version 2>&1 || echo "no system chrome found — playwright chromium will be used"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime-proof.txt
          playwright install --with-deps chromium
          python3 -c "import PIL; print(f'Pillow {PIL.__version__}')"
          python3 -c "import importlib.metadata; print(f'playwright {importlib.metadata.version(\"playwright\")}')"
          python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"

      - name: Generate runtime-proof fixtures
        run: |
          python3 core/make_runtime_fixture.py
          python3 core/make_artifact_001.py --draft || python3 core/make_artifact_001.py

      - name: Verify media pix_fmt (yuv420p H.264)
        run: |
          echo "== ffprobe pix_fmt gate =="
          for f in runtime-proof/media/*.mp4 artifact-001/media/*.mp4; do
            [ -f "$f" ] || continue
            echo "== $f =="
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,profile,width,height,avg_frame_rate -of default=noprint_wrappers=1 "$f"
            pix=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=noprint_wrappers=1:nokey=1 "$f" | tr -d '[:space:]')
            if [ "$pix" != "yuv420p" ]; then
              echo "pix_fmt not yuv420p ($pix): $f" >&2
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of json "$f"
              exit 1
            fi
          done

      - name: Run Full Test Suite
        env:
          PORTVS_BROWSER_TRANSPORT: in-memory
        run: |
          echo "== browser selection =="
          SYSTEM_CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium 2>/dev/null || which chromium-browser 2>/dev/null || echo "")
          if [ -n "$SYSTEM_CHROME" ]; then
            echo "SYSTEM_CHROME=$SYSTEM_CHROME"
            ls -l "$SYSTEM_CHROME" || true
            "$SYSTEM_CHROME" --version 2>&1 || true
            export PORTVS_BROWSER_EXECUTABLE="$SYSTEM_CHROME"
            echo "PORTVS_BROWSER_EXECUTABLE=$PORTVS_BROWSER_EXECUTABLE"
          else
            PW_CHROME=$(python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()" 2>/dev/null || echo "")
            echo "PLAYWRIGHT_CHROME=$PW_CHROME"
            ls -l "$PW_CHROME" || true
            if [ -n "$PW_CHROME" ]; then export PORTVS_BROWSER_EXECUTABLE="$PW_CHROME"; echo "PORTVS_BROWSER_EXECUTABLE=$PORTVS_BROWSER_EXECUTABLE (playwright)"; fi
          fi
          python3 -m unittest discover -s tests -v

      - name: Verify Local Lifecycle Cleanliness
        run: |
          python3 tools/verify_local_lifecycle.py

      - name: Verify Edition Presets
        run: |
          python3 tools/verify_editions.py

      - name: Verify Layouts
        run: |
          python3 tools/verify_layouts.py --examples

      - name: Report Edition Status
        run: |
          python3 tools/edition_status.py
