name: Current State Projection

on:
  workflow_run:
    workflows: [CI Verification, Package Verification]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: current-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read trusted default-branch observer only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Resolve proof role
        id: layout
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from tools.paths import LAYOUT
          print(f"proofs={LAYOUT.relative('proofs')}/current-status")
          PY

      - name: Observe live GitHub state without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.verification.repository_status --repository 4444J99/simvltanea --expected-repository-id 1364497735

      - name: Preserve timestamped observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-state-${{ github.run_id }}
          path: ${{ steps.layout.outputs.proofs }}/run-*/
          if-no-files-found: error
          retention-days: 7
